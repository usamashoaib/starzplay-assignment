spring.application.name=starzplay-assignment

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/starzplay?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate JPA Configuration
# Schema and seed data are owned by schema.sql / data.sql, so Hibernate does not manage DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# SQL initialization (creates tables and seeds data on startup)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Include the per-request id (set by RequestIdFilter) in console logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n


